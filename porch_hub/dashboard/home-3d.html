<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porch Home 3D</title>
<link rel="icon" href="data:,">
<!--
  The 3D digital twin. Same model as Clawblox's renderers: the hub owns the state and streams it
  over /ws/events; this page only turns the latest state into a Three.js scene. The house itself
  comes from the home's layout (GET /home/layout), the same plan the 2D twin draws, so nothing
  about one home is written here. Three.js is served by the hub itself (/vendor/three/), so the
  page works with no internet.
-->
<style>
:root {
  --bg: #0b1220; --panel: rgba(15, 23, 42, .92); --line: #1e293b; --ink: #e2e8f0; --muted: #94a3b8;
  --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --info: #38bdf8; --accent: #5eead4;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; pointer-events: none; z-index: 3; }
header > * { pointer-events: auto; }
.brand { font-weight: 700; letter-spacing: .14em; font-size: 13px; }
.brand span { color: var(--muted); font-weight: 500; letter-spacing: .04em; margin-left: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.dot.on { background: var(--ok); }
.pill.offline { color: var(--warn); border-color: rgba(251, 191, 36, .35); }
.pill.live { color: var(--ok); border-color: rgba(52, 211, 153, .35); }
.hint { color: var(--muted); font-size: 12px; margin-left: auto; }
.views { display: flex; gap: 6px; }
.views button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; font-size: 12px; }
.views button:hover { border-color: #334155; }

#panel { position: fixed; top: 56px; right: 12px; width: 300px; max-height: calc(100% - 68px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; z-index: 3; backdrop-filter: blur(8px); }
#panel h2 { margin: 0; font-size: 16px; }
#panel .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
#panel dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 12px 0; font-size: 13px; }
#panel dt { color: var(--muted); overflow-wrap: anywhere; }
#panel dt.group { grid-column: 1 / -1; margin-top: 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #64748b; }
#panel dd { margin: 0; font-family: var(--mono); font-size: 12px; text-align: right; max-width: 150px; overflow-wrap: anywhere; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cmds button { border: 1px solid #334155; background: #1e293b; border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.cmds button:hover:not(:disabled) { background: #334155; }
.cmds button:disabled { opacity: .5; cursor: not-allowed; }
.cmds input { width: 56px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: var(--ink); padding: 4px 6px; font: inherit; }
.result { margin-top: 10px; font-size: 12px; min-height: 18px; }
.result.ok { color: var(--ok); } .result.bad { color: var(--bad); } .result.info { color: var(--info); } .result.warn { color: var(--warn); }
.result button { display: block; margin-top: 8px; border: 1px solid rgba(251, 191, 36, .5); background: rgba(251, 191, 36, .12); color: var(--warn); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
.result button:hover { background: rgba(251, 191, 36, .22); }
.note { margin-top: 8px; color: var(--warn); font-size: 12px; }
.energy { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.list { display: grid; gap: 4px; margin-top: 10px; }
.list button { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.list button:hover { border-color: #334155; background: #111a2e; }
.list small { color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.back { border: 0; background: none; color: var(--muted); padding: 0; font-size: 12px; margin-bottom: 8px; }

html.framed #panel, html.framed #feed { display: none !important; }
/* ?record: the Live page's recording mode says each step in one large caption below. */
html.record header, html.record #porch-caption { display: none !important; }
#feed { position: fixed; left: 12px; bottom: 12px; width: min(440px, calc(100% - 24px)); display: grid; gap: 4px; z-index: 3; pointer-events: none; }
#feed div { background: var(--panel); border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px; padding: 5px 9px; font-size: 12px; }
#feed .ok { border-left-color: var(--ok); } #feed .bad { border-left-color: var(--bad); } #feed .info { border-left-color: var(--info); } #feed .warn { border-left-color: var(--warn); }
#feed time { color: var(--muted); font-family: var(--mono); margin-right: 6px; }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.tag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; border: 1px solid rgba(148, 163, 184, .25); background: rgba(11, 18, 32, .82); border-radius: 6px; padding: 3px 7px; font-size: 11px; line-height: 1.3; white-space: nowrap; text-align: center; }
.tag b { display: block; font-weight: 600; color: var(--ink); }
.tag i { font-style: normal; font-family: var(--mono); font-size: 10.5px; }
.tag .ok { color: var(--ok); } .tag .warn { color: var(--warn); } .tag .bad { color: var(--bad); } .tag .info { color: var(--info); } .tag .muted { color: var(--muted); }
.tag.selected { border-color: var(--accent); }
.tag.ghost { pointer-events: none; border-style: dashed; background: rgba(11, 18, 32, .6); color: var(--muted); }
.tag.ghost b { color: var(--muted); font-weight: 500; }
.tag .flash { display: block; margin-top: 2px; font-family: var(--mono); font-size: 10px; }

/* The household's agents above the house, Porch between them and the home (agents.js). */
.tag.agent { pointer-events: none; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; transform: translate(-50%, calc(-100% - 9px)); text-align: left; }
.tag.agent .face { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #64748b; color: #0b1220; font-weight: 800; font-size: 11px; }
.tag.agent .face.claude { background: #e8a27c; } .tag.agent .face.chatgpt { background: #5fd4b4; }
.tag.agent small { display: block; color: var(--muted); font-size: 10px; }
.tag.agent.never { opacity: .55; }
/* More than four agents: every other tag stands higher, on a thin line down to its orb, so
   neighbours never cover each other however many there are. */
.tag.agent.lift { margin-top: -44px; }
.tag.agent.lift::after { content: ""; position: absolute; left: 50%; top: 100%; height: 44px; border-left: 1px dashed rgba(148, 163, 184, .45); }
.tag.agent.active { border-color: var(--info); box-shadow: 0 0 0 2px rgba(56, 189, 248, .35); }
.tag.porch { pointer-events: none; font-weight: 800; letter-spacing: .28em; color: #c4b5fd; border-color: rgba(167, 139, 250, .6); }
#porch-caption { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(660px, calc(100% - 360px)); z-index: 3; pointer-events: none; text-align: center; background: var(--panel); border: 1px solid rgba(167, 139, 250, .55); border-radius: 10px; padding: 8px 14px; }
#porch-caption b { display: block; font-size: 14px; }
#porch-caption span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
#porch-caption.ok { border-color: var(--ok); } #porch-caption.held { border-color: var(--warn); }
#porch-caption.blocked { border-color: var(--bad); } #porch-caption.live { border-color: var(--info); }

@media (max-width: 720px) {
  #porch-caption { bottom: auto; top: 96px; max-width: calc(100% - 24px); }
  .hint { display: none; }
  #panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 40%; }
  #feed { display: none; }
}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js" } }
</script>
<script src="/nav.js" defer></script>
<script src="/details.js" defer></script>
<script src="/energy.js" defer></script>
<script src="/agents.js" defer></script>
<script>
// Framed by another hub page (Live flow + 3D): the page beside this one tells every step, so the
// scene takes the whole frame, without its own device panel and event list.
try { if (window.parent !== window && window.parent.location.origin === location.origin) document.documentElement.classList.add("framed"); }
catch { /* framed by another site: stay as a page of its own */ }
if (new URLSearchParams(location.search).has("record")) document.documentElement.classList.add("record");
</script>
</head>
<body>
<div id="scene" aria-label="3D model of the home with its devices"></div>
<div id="labels"></div>

<header>
  <porch-nav></porch-nav>
  <div class="brand">PORCH<span>3D home twin</span></div>
  <div class="pill"><span id="ws-dot" class="dot"></span><span id="ws-label">Connecting…</span></div>
  <div id="mode-pill" class="pill live">LIVE HARDWARE</div>
  <div class="views">
    <button id="view-overview" type="button">Overview</button>
    <button id="view-top" type="button">Top</button>
  </div>
  <div class="hint">Drag to orbit · scroll to zoom · click a device</div>
</header>

<aside id="panel" aria-live="polite"></aside>
<div id="porch-caption" hidden aria-live="polite"><b></b><span></span></div>
<div id="feed" aria-live="polite"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "/vendor/three/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const devicePath = (id) => id.split("/").map(encodeURIComponent).join("/");
const newKey = () => `home3d-${(crypto.randomUUID && crypto.randomUUID()) || Date.now() + "-" + Math.random()}`;
const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
// Recording (?record): no device response times on screen; they change as Porch improves.
const SHOW_TIMES = !document.documentElement.classList.contains("record");

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function hub(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data));
    error.status = response.status;
    throw error;
  }
  return data;
}

function attr(device, cluster, name) {
  const c = device && device.clusters && device.clusters[cluster];
  return c ? c.attributes[name] : undefined;
}

// ---- Scene

const container = $("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.32;
controls.minDistance = 5;
controls.maxDistance = 34;

const VIEWS = {
  overview: { position: [1.5, 14.5, 16.5], target: [0, 0, 0] },
  top: { position: [0, 22, 0.01], target: [0, 0, 0] },
};
// Back the overview (and top) camera off far enough that the whole house fits the part of the
// screen the panel leaves free. fullHeight is the height the camera's field of view spans. The
// house's size comes from its layout, so "extent" is set once the layout has been read.
let extent = { halfW: 8.6, halfD: 7 };
const fitExtra = [];   // points above the house the overview must also show: the agents and Porch
const OVERVIEW_FROM = new THREE.Vector3(1.5, 14.5, 15.9).normalize();
function fitViews(visibleWidth, visibleHeight, fullHeight) {
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const tanH = tan * (visibleWidth / fullHeight), tanV = tan * (visibleHeight / fullHeight);
  // The overview looks down at an angle, so the near corners spread wider than the far ones:
  // take the distance at which every corner of the house, floor and wall top, is inside the view.
  const target = new THREE.Vector3(...VIEWS.overview.target);
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), OVERVIEW_FROM).normalize();
  const up = new THREE.Vector3().crossVectors(OVERVIEW_FROM, right);
  let distance = 0;
  for (const x of [-extent.halfW, extent.halfW]) for (const z of [-extent.halfD, extent.halfD]) for (const y of [0, 1.8]) {
    const corner = new THREE.Vector3(x, y, z).sub(target);
    const toward = corner.dot(OVERVIEW_FROM);
    distance = Math.max(distance, Math.abs(corner.dot(right)) / tanH + toward, Math.abs(corner.dot(up)) / tanV + toward);
  }
  for (const point of fitExtra) {
    const corner = point.clone().sub(target);
    const toward = corner.dot(OVERVIEW_FROM);
    distance = Math.max(distance, Math.abs(corner.dot(right)) / tanH + toward, Math.abs(corner.dot(up)) / tanV + toward);
  }
  VIEWS.overview.position = OVERVIEW_FROM.clone().multiplyScalar(distance).add(target).toArray();
  VIEWS.top.position = [0, Math.max(extent.halfW / tanH, extent.halfD / tanV) + 1.8, 0.01];
  controls.maxDistance = Math.max(34, distance * 1.3, VIEWS.top.position[1] * 1.2);
}
let cameraGoal = null;   // {position, target}: eased toward each frame
let framed = "overview"; // the preset view the camera is on, until the viewer moves it
function setView(name) {
  const v = VIEWS[name];
  framed = name;
  cameraGoal = { position: new THREE.Vector3(...v.position), target: new THREE.Vector3(...v.target) };
}
controls.addEventListener("start", () => { framed = null; cameraGoal = null; });
camera.position.set(...VIEWS.overview.position);
controls.target.set(...VIEWS.overview.target);
$("view-overview").addEventListener("click", () => setView("overview"));
$("view-top").addEventListener("click", () => setView("top"));

scene.add(new THREE.HemisphereLight(0xdbe7ff, 0x1a2030, 1.4));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(7, 14, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.05, ...extra });
function box(w, h, d, material, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function cylinder(r, h, material, x, y, z, parent = scene, segments = 28) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segments), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ---- The house: built from the home's layout (GET /home/layout), cut away at 1.1 m so you can see in.
// The layout is in feet; the scene is in metres. Floors stand side by side, left to right.

const FT = 0.3048;
const GAP = 1.6;
let layout;
try {
  layout = await hub("GET", "/home/layout");
} catch (error) {
  // Without the plan there is still a home to show: one empty room, every device in front of it,
  // and the panel says what went wrong (a hub started before this page existed has no plan).
  layout = { name: "Home", source: "none", placements: {}, extras: [],
             problem: `The hub did not send this home's plan (${error.message}). Restart the hub.`,
             floors: [{ id: "floor", name: "Home", width: 40, depth: 26, fixtures: [],
                        rooms: [{ id: "home", name: "Home", x: 0, y: 0, w: 40, d: 26, kind: "room", matches: [] }] }] };
}
const HOUSE = {
  w: layout.floors.reduce((sum, floor) => sum + floor.width * FT, 0) + GAP * (layout.floors.length - 1),
  d: Math.max(...layout.floors.map((floor) => floor.depth * FT)),
};
const ORIGINS = new Map();   // floor id -> where its top-left corner is in the scene
{
  let x = -HOUSE.w / 2;
  for (const floor of layout.floors) {
    ORIGINS.set(floor.id, { x, z: -HOUSE.d / 2 });
    x += floor.width * FT + GAP;
  }
}
const ROOMS = new Map();     // room id -> {x: [from, to], z: [from, to]} in the scene
const ROOM_NAMES = new Map();  // a room's name or one of its "matches", lowercased -> room id
for (const floor of layout.floors) {
  const origin = ORIGINS.get(floor.id);
  for (const room of floor.rooms) {
    ROOMS.set(room.id, { x: [origin.x + room.x * FT, origin.x + (room.x + room.w) * FT],
                         z: [origin.z + room.y * FT, origin.z + (room.y + room.d) * FT] });
    for (const name of [room.name, ...room.matches]) ROOM_NAMES.set(name.trim().toLowerCase(), room.id);
  }
}
const inRoom = (id, fx, fz) => {
  const room = ROOMS.get(id);
  return { x: room.x[0] + fx * (room.x[1] - room.x[0]), z: room.z[0] + fz * (room.z[1] - room.z[0]) };
};

function floorLabel(text, x, z, width = 2.6) {
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 96;
  const g = canvas.getContext("2d");
  g.fillStyle = "rgba(226, 232, 240, 0.55)";
  g.font = "600 44px ui-sans-serif, system-ui, sans-serif";
  g.fillText(text.toUpperCase(), 8, 64);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 0.1885),
                               new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false }));
  plane.rotation.x = -Math.PI / 2;
  plane.position.set(x + width / 2 + 0.05, 0.012, z + width * 0.16);
  scene.add(plane);
}

const WALL_H = 1.1, WALL_T = 0.1, DOOR_H = WALL_H * 0.97, DOOR_T = 0.06;
const wallMat = mat(0xc9d1dc, { roughness: 0.9 });
const capMat = mat(0xeef2f7);

// The doors the plan draws: where each is and which way its wall runs. A wall leaves an opening
// for a door on its line, and a door lock takes the door nearest to where it is placed.
const DOORS = [];
for (const floor of layout.floors) {
  const origin = ORIGINS.get(floor.id);
  for (const fixture of floor.fixtures) {
    if (fixture.kind !== "door") continue;
    const along = fixture.w >= fixture.d ? "x" : "z";
    const width = Math.max(fixture.w, fixture.d, 2.5) * FT;
    const x = origin.x + (fixture.x + fixture.w / 2) * FT, z = origin.z + (fixture.y + fixture.d / 2) * FT;
    const centre = along === "x" ? x : z;
    DOORS.push({ x, z, along, width, fixed: along === "x" ? z : x, from: centre - width / 2, to: centre + width / 2,
                 leaf: null, taken: false });
  }
}

// One axis-aligned wall along x (at a fixed z) or along z (at a fixed x), in as many pieces as
// the doors on its line leave.
function wall(axis, fixed, from, to) {
  const doors = DOORS.filter((door) => door.along === axis && Math.abs(door.fixed - fixed) < 0.06 && door.to > from && door.from < to)
                     .sort((a, b) => a.from - b.from);
  const pieces = [];
  let start = from - WALL_T / 2;
  for (const door of doors) {
    if (door.from > start) pieces.push([start, door.from]);
    start = Math.max(start, door.to);
  }
  if (to + WALL_T / 2 > start) pieces.push([start, to + WALL_T / 2]);
  for (const [a, b] of pieces) {
    const len = b - a, mid = (a + b) / 2;
    const [w, d, x, z] = axis === "x" ? [len, WALL_T, mid, fixed] : [WALL_T, len, fixed, mid];
    box(w, WALL_H, d, wallMat, x, WALL_H / 2, z);
    box(w + 0.001, 0.02, d + 0.001, capMat, x, WALL_H + 0.01, z).castShadow = false;
  }
}

const FLOOR_COLORS = { room: 0x3d3429, kitchen: 0x2f3c3c, bath: 0x2b3742, hall: 0x33353d, store: 0x26292f, outside: 0x1f2a22 };
const stairMat = mat(0x8b7355), counterMat = mat(0xd6d3cc), doorMat = mat(0x8b6b4e);
for (const floor of layout.floors) {
  const origin = ORIGINS.get(floor.id);
  const fw = floor.width * FT, fd = floor.depth * FT;
  box(fw + 0.5, 0.2, fd + 0.5, mat(0x141c2b), origin.x + fw / 2, -0.1, origin.z + fd / 2).castShadow = false;
  if (layout.floors.length > 1) floorLabel(floor.name, origin.x, origin.z + fd + 0.35, 2.2);
  const built = new Set();   // walls two rooms share are built once
  const edge = (axis, fixed, from, to) => {
    const key = [axis, fixed, from, to].map((n) => (typeof n === "number" ? n.toFixed(2) : n)).join("|");
    if (built.has(key)) return;
    built.add(key);
    wall(axis, fixed, from, to);
  };
  for (const room of floor.rooms) {
    const at = ROOMS.get(room.id);
    const w = at.x[1] - at.x[0], d = at.z[1] - at.z[0];
    const tiles = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat(FLOOR_COLORS[room.kind] ?? FLOOR_COLORS.room, { roughness: 0.95 }));
    tiles.rotation.x = -Math.PI / 2;
    tiles.position.set(at.x[0] + w / 2, 0.005, at.z[0] + d / 2);
    tiles.receiveShadow = true;
    scene.add(tiles);
    if (w > 1.1 && d > 0.7) floorLabel(room.name, at.x[0] + 0.1, at.z[0] + 0.05, Math.min(2.4, w - 0.25));
    edge("x", at.z[0], at.x[0], at.x[1]);
    edge("x", at.z[1], at.x[0], at.x[1]);
    edge("z", at.x[0], at.z[0], at.z[1]);
    edge("z", at.x[1], at.z[0], at.z[1]);
  }
  for (const fixture of floor.fixtures) {
    const x = origin.x + fixture.x * FT, z = origin.z + fixture.y * FT, w = fixture.w * FT, d = fixture.d * FT;
    if (fixture.kind === "stairs") {
      // Steps rise along the longer side, up to the cut-away height.
      const along = d >= w ? "z" : "x";
      const steps = Math.max(3, Math.round((along === "z" ? d : w) / 0.3));
      for (let i = 0; i < steps; i++) {
        const h = ((i + 1) / steps) * WALL_H;
        const run = (along === "z" ? d : w) / steps;
        if (along === "z") box(w - 0.12, h, run, stairMat, x + w / 2, h / 2, z + run * (i + 0.5));
        else box(run, h, d - 0.12, stairMat, x + run * (i + 0.5), h / 2, z + d / 2);
      }
    } else if (fixture.kind === "counter") {
      box(w, 0.9, d, counterMat, x + w / 2, 0.45, z + d / 2);
    }
  }
}
// Each door stands closed in its opening, until a lock placed on it takes it over.
for (const door of DOORS) {
  const [w, d] = door.along === "x" ? [door.width, DOOR_T] : [DOOR_T, door.width];
  door.leaf = box(w, DOOR_H, d, doorMat, door.x, DOOR_H / 2, door.z);
}
const white = mat(0xe5e7eb), dark = mat(0x1f2937);

// The camera and the sun's shadow reach as far as this home does (devices that fit no room stand
// in a row in front of it).
extent = { halfW: HOUSE.w / 2 + 0.9, halfD: HOUSE.d / 2 + 1.6 };
{
  const reach = Math.hypot(HOUSE.w, HOUSE.d) / 2 + 3;
  Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach, far: reach * 2 + 30 });
  sun.shadow.camera.updateProjectionMatrix();
}

// Things in the home the hub does not list (layout "extras"): a grey block and a dashed tag, so
// the picture stays honest about what is connected.
const ghosts = [];   // {at, tag}
const ghostMat = new THREE.MeshStandardMaterial({ color: 0x64748b, transparent: true, opacity: 0.45, roughness: 0.9 });
for (const extra of layout.extras) {
  if (!ROOMS.has(extra.room)) continue;
  const at = inRoom(extra.room, extra.x, extra.y);
  const block = box(0.5, 0.5, 0.3, ghostMat, at.x, 0.25, at.z);
  block.castShadow = false;
  const tag = el("div", "tag ghost");
  tag.append(el("b", "", extra.name), el("i", "muted", "not connected"));
  tag.title = extra.note;
  tag.setAttribute("aria-label", `${extra.name}: ${extra.note}`);
  $("labels").appendChild(tag);
  ghosts.push({ at: new THREE.Vector3(at.x, 0.95, at.z), tag });

// ---- Devices. Each builder returns { group, update(device, now, dt), label() } placed in its room.

const TONE = { ok: 0x34d399, warn: 0xfbbf24, bad: 0xfb7185, info: 0x38bdf8, off: 0x475569 };
function led(parent, x, y, z, r = 0.035) {
  const m = new THREE.MeshStandardMaterial({ color: 0x111827, emissive: TONE.off, emissiveIntensity: 1.5 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m);
  mesh.position.set(x, y, z);
  parent.add(mesh);
  return (tone) => m.emissive.setHex(TONE[tone] ?? TONE.off);
}
function placed(x, z, rotation = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.y = rotation;
  scene.add(group);
  return group;
}
// The turn that makes something face into its room, with its back to the nearest wall.
function facingIntoRoom(spot) {
  const room = spot.room ? ROOMS.get(spot.room) : null;
  if (!room) return 0;
  const walls = [[spot.z - room.z[0], 0], [room.z[1] - spot.z, Math.PI],
                 [spot.x - room.x[0], Math.PI / 2], [room.x[1] - spot.x, -Math.PI / 2]];
  return walls.sort((a, b) => a[0] - b[0])[0][1];
}
// What a TV is doing, in a word: what it plays, unless it is in standby. A TV nobody is using
// reports no activity at all, only that nothing is playing.
function tvState(dev) {
  const activity = attr(dev, "PorchMediaExtension", "ActivityState");
  const playing = attr(dev, "MediaPlayback", "CurrentState");
  if (activity === "Standby") return "Standby";
  if (["Playing", "Paused", "Buffering"].includes(playing)) return playing;
  if (activity === "Active") return "In use";
  if (activity === "Inactive") return "Idle";
  return playing === "NotPlaying" ? "Not playing" : "?";
}

const BUILDERS = {
  lock(type, d, spot) {
    // The lock is on a door. A door the plan draws within reach becomes that door, with the
    // lock on the side of the room the lock is in; otherwise it gets a door of its own.
    const reach = (door) => Math.hypot(door.x - spot.x, door.z - spot.z);
    const door = DOORS.filter((c) => !c.taken && reach(c) < 2.5).sort((a, b) => reach(a) - reach(b))[0];
    const at = door || spot;
    const width = door ? door.width : 1.0;
    const home = spot.room ? ROOMS.get(spot.room) : null;
    const inside = home ? { x: (home.x[0] + home.x[1]) / 2, z: (home.z[0] + home.z[1]) / 2 } : { x: at.x, z: at.z + 1 };
    const facing = !door ? 0 : door.along === "x" ? (inside.z >= door.z ? 0 : Math.PI) : (inside.x >= door.x ? Math.PI / 2 : -Math.PI / 2);
    if (door) { door.taken = true; door.leaf.visible = false; }
    const group = placed(at.x, at.z, facing);
    // The leaf turns on its hinge edge. Its hardware is on the room side, which is local +z.
    const swing = new THREE.Group();
    swing.position.set(-width / 2, 0, 0);
    group.add(swing);
    const leaf = box(width, DOOR_H, DOOR_T, mat(0x8b6b4e), width / 2, DOOR_H / 2, 0, swing);
    box(0.12, 0.2, 0.06, mat(0x334155, { metalness: 0.5, roughness: 0.4 }), width - 0.16, 0.62, DOOR_T / 2 + 0.03, swing);
    const bolt = box(0.14, 0.03, 0.03, mat(0xcbd5e1, { metalness: 0.8, roughness: 0.25 }), width - 0.03, 0.62, DOOR_T / 2 + 0.03, swing);
    const light = led(swing, width - 0.16, 0.76, DOOR_T / 2 + 0.065);
    return {
      group, labelAt: new THREE.Vector3(at.x, 1.6, at.z),
      release() { if (door) { door.taken = false; door.leaf.visible = true; } },
      update(d, now, dt) {
        const locked = attr(d, "DoorLock", "LockState") === "Locked";
        bolt.position.x = locked ? width - 0.03 : width - 0.13;   // the bolt reaches the frame only when locked
        light(locked ? "ok" : "warn");
        leaf.material.color.setHex(locked ? 0x8b6b4e : 0x9c7a58);
        // An unlocked door stands a little ajar, into the room, so the state reads from across it.
        const ajar = locked ? 0 : -0.4;
        swing.rotation.y = motion ? swing.rotation.y + (ajar - swing.rotation.y) * Math.min(1, dt * 5) : ajar;
      },
      label(d) { const s = attr(d, "DoorLock", "LockState"); return [s || "?", s === "Locked" ? "ok" : "warn"]; },
    };
  },

  leak(type, d, spot) {
    const group = placed(spot.x, spot.z);
    cylinder(0.11, 0.05, white, 0, 0.03, 0, group);
    const light = led(group, 0, 0.065, 0, 0.025);
    const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.75, 40),
      new THREE.MeshStandardMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.55, roughness: 0.1, metalness: 0.2 }));
    puddle.rotation.x = -Math.PI / 2; puddle.position.y = 0.013; group.add(puddle);
    const alarm = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.26, 40),
      new THREE.MeshBasicMaterial({ color: TONE.bad, transparent: true, side: THREE.DoubleSide }));
    alarm.rotation.x = -Math.PI / 2; alarm.position.y = 0.02; group.add(alarm);
    let wet = false;
    return {
      group, labelAt: new THREE.Vector3(spot.x, 1.25, spot.z + 0.25),
      update(d, now) {
        wet = attr(d, "BooleanState", "StateValue") === true;
        puddle.visible = alarm.visible = wet;
        light(wet ? "bad" : "ok");
        if (wet && motion) {
          const k = (now / 1200) % 1;
          alarm.scale.setScalar(1 + k * 3.5);
          alarm.material.opacity = 1 - k;
        }
      },
      label(d) { const w = attr(d, "BooleanState", "StateValue"); return [w ? "Water detected" : w === false ? "Dry" : "?", w ? "bad" : "ok"]; },
    };
  },

  valve(type, d, spot) {
    // A stretch of the main pipe, the valve in the middle.
    const group = placed(spot.x, spot.z);
    const pipeMat = mat(0x94a3b8, { metalness: 0.7, roughness: 0.35 });
    const pipe = cylinder(0.06, 2.0, pipeMat, 0, 0.45, 0, group);
    pipe.rotation.x = Math.PI / 2;
    const valveBody = box(0.2, 0.2, 0.26, mat(0xb45309, { metalness: 0.5 }), 0, 0.45, 0, group);
    const stem = cylinder(0.02, 0.18, pipeMat, 0, 0.62, 0, group);
    const handle = box(0.06, 0.04, 0.42, mat(0xdc2626), 0, 0.72, 0, group);
    const light = led(group, -0.11, 0.6, 0.12);
    const flow = [];
    const flowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    for (let i = 0; i < 9; i++) {
      const drop = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), flowMat);
      drop.position.set(-0.07, 0.45, -1.0 + i * 0.22);

    return {
      group, labelAt: new THREE.Vector3(spot.x - 0.2, 1.5, spot.z),
      update(d, now) {
        open = attr(d, "ValveConfigurationAndControl", "CurrentState") === "Open";

        light(open ? "ok" : "bad");
        for (const [i, drop] of flow.entries()) {
          drop.visible = open;
          if (open && motion) drop.position.z = -1.0 + ((i * 0.22 + now / 600) % 2.0);
        }

      label(d) { const s = attr(d, "ValveConfigurationAndControl", "CurrentState"); return [s || "?", s === "Open" ? "ok" : "bad"]; },
    };

  lamp(type, d, spot) {
    // A floor lamp: it stands anywhere, and it lights the room around it when it is on.
    const group = placed(spot.x, spot.z);
    cylinder(0.15, 0.03, dark, 0, 0.015, 0, group);

    shade.position.set(0, 1.3, 0); group.add(shade);

  dryer(type, d, spot) {
    const group = placed(spot.x, spot.z);
    const shell = box(0.72, 0.9, 0.7, type === "LaundryWasher" ? mat(0xdbe4ee) : white, 0, 0.45, 0, group);
    box(0.72, 0.12, 0.04, mat(0x334155), 0, 0.84, 0.36, group);                // control panel
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.035, 12, 36), mat(0x94a3b8, { metalness: 0.7 }));
    ring.position.set(0, 0.45, 0.36); group.add(ring);
    const drum = new THREE.Group();
    drum.position.set(0, 0.45, 0.33);
    group.add(drum);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.2, 32), new THREE.MeshStandardMaterial({ color: 0x1e3a5f, roughness: 0.15, metalness: 0.3 }));
    drum.add(glass);

      group, labelAt: new THREE.Vector3(spot.x, 1.55, spot.z + 0.15),
      update(d, now, dt) {
        state = attr(d, "OperationalState", "OperationalState");

      },
      label(d) {
        const s = attr(d, "OperationalState", "OperationalState");
        const delay = attr(d, "PorchLaundryExtension", "RelativeHourToStart") || 0;
        if (s !== "Running" && delay > 0) return [`Starts in ${delay} h`, "info"];

  vacuum(type, d, spot) {
    const dock = placed(spot.x, spot.z);
    box(0.4, 0.3, 0.14, mat(0x334155), 0, 0.15, 0, dock);
    const dockLight = led(dock, 0, 0.25, 0.075, 0.02);
    const robot = new THREE.Group();
    scene.add(robot);
    cylinder(0.19, 0.08, mat(0x1f2937, { roughness: 0.4 }), 0, 0.05, 0, robot);
    cylinder(0.08, 0.03, mat(0x475569), 0, 0.1, -0.05, robot);
    const light = led(robot, 0, 0.1, 0.12, 0.02);
    const home = new THREE.Vector3(spot.x, 0, spot.z + 0.4);
    robot.position.copy(home);
    let t = 0;
    const path = (u) => new THREE.Vector3(spot.x + 0.9 * Math.cos(u) + 0.15 * Math.sin(3 * u), 0, spot.z + 1.2 + 0.5 * Math.sin(u));
    return {
      group: robot, extra: [dock], labelAt: null,
      update(d, now, dt) {
        const s = attr(d, "RvcOperationalState", "OperationalState");
        let goal = home;
        if (s === "Running") { if (motion) t += dt * 0.35; goal = path(t); }
        else if (s === "Paused") goal = robot.position;
        const step = goal.clone().sub(robot.position);
        const max = dt * 0.9;
        if (step.length() > 0.002) {
          robot.rotation.y = Math.atan2(step.x, step.z);
          robot.position.add(step.length() > max ? step.setLength(max) : step);
        }
        light(s === "Running" ? "ok" : s === "Paused" ? "warn" : "info");
        dockLight(robot.position.distanceTo(home) < 0.05 ? "ok" : "off");
        this.labelAt = robot.position.clone().setY(0.85);
      },
      label(d) {
        const s = attr(d, "RvcOperationalState", "OperationalState");
        const pct = attr(d, "PowerSource", "BatPercentRemaining");
        const battery = typeof pct === "number" ? ` · ${Math.round(pct / 2)}%` : "";
        return [`${s || "?"}${battery}`, s === "Running" ? "ok" : s === "Paused" ? "warn" : "muted"];
      },
    };
  },

  stick(type, d, spot) {

  tv(type, d, spot) {
    // A TV on a low console, its back to the nearest wall. The screen shows what it is doing:

    const turn = facingIntoRoom(spot);
    const group = placed(spot.x, spot.z, turn);
    box(1.15, 0.32, 0.34, mat(0x4b3f33), 0, 0.16, 0, group);                    // the console
    box(0.26, 0.05, 0.14, dark, 0, 0.345, -0.05, group);                        // the TV's foot
    box(1.0, 0.58, 0.035, dark, 0, 0.66, -0.05, group);                         // and its body
    const screenMat = new THREE.MeshStandardMaterial({ color: 0x0b1220, emissive: 0x38bdf8, emissiveIntensity: 0, roughness: 0.35 });
    const screen = new THREE.Mesh(new THREE.BoxGeometry(0.94, 0.52, 0.01), screenMat);
    screen.position.set(0, 0.66, -0.03);
    group.add(screen);
    const barMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
    const bars = new THREE.Group();
    for (const x of [-0.05, 0.05]) box(0.045, 0.19, 0.006, barMat, x, 0.66, -0.022, bars).castShadow = false;
    group.add(bars);
    box(0.16, 0.035, 0.09, white, 0.36, 0.3375, 0.06, group);                   // the streaming box
    const light = led(group, 0.36, 0.36, 0.105, 0.014);
    const glow = new THREE.PointLight(0x7dd3fc, 0, 3.2, 1.8);
    glow.position.set(0, 0.66, 0.55);
    group.add(glow);
    const TAGS = { Playing: "info", Paused: "warn", Buffering: "info", "In use": "ok" };
    return {
      group, labelAt: new THREE.Vector3(spot.x, 1.55, spot.z),
      front: new THREE.Vector3(Math.sin(turn), 0, Math.cos(turn)),   // the way the screen faces
      update(dev, now) {
        const s = dev.online ? tvState(dev) : "?";
        const lit = { Playing: 1.25, Buffering: 0.7, Paused: 0.45, "In use": 0.4 }[s] || 0;
        // While it plays the picture changes; any other state holds one colour.
        if (s === "Playing" && motion) screenMat.emissive.setHSL((now / 14000) % 1, 0.6, 0.55);
        else screenMat.emissive.setHex(0x38bdf8);
        const breath = s === "Buffering" && motion ? 0.3 * Math.sin(now / 220) : 0;
        screenMat.emissiveIntensity = lit + breath;
        glow.color.copy(screenMat.emissive);
        glow.intensity = lit * 2.2;
        bars.visible = s === "Paused";
        light(TAGS[s] || "off");
      },
      label(dev) { const s = tvState(dev); return [s, TAGS[s] || "muted"]; },
    };
  },

  doorbell(type, d, spot) {
    // A doorbell on its post by the door. The hub reads it; it takes no commands.
    const group = placed(spot.x, spot.z);
    cylinder(0.02, 1.2, dark, 0, 0.6, 0, group);
    box(0.08, 0.18, 0.05, mat(0x334155, { metalness: 0.4, roughness: 0.4 }), 0, 1.25, 0, group);
    const light = led(group, 0, 1.22, 0.03, 0.022);
    return {
      group, labelAt: new THREE.Vector3(spot.x, 1.75, spot.z),
      update(dev) { light(dev.online ? "ok" : "off"); },
      label(dev) { return [dev.online ? "Ready" : "offline", "ok"]; },
    };
  },

  generic(type, d, spot) {
    // Anything the scene has no model for yet: a labelled box in its room.
    const group = placed(spot.x, spot.z);
    box(0.3, 0.3, 0.3, mat(0x64748b), 0, 0.15, 0, group);
    const light = led(group, 0, 0.32, 0.12);
    return {
      group, labelAt: new THREE.Vector3(spot.x, 1.0, spot.z),
      update(dev) { light(dev.online ? "ok" : "off"); },
      label(dev) {
        const first = Object.values(dev.clusters || {})[0];
        const value = first ? Object.values(first.attributes)[0] : undefined;
        return [value === undefined ? dev.device_type : String(value), "muted"];
      },
    };
  },
};

// A light's brightness as a share of full (Matter's CurrentLevel counts 1 to 254), or null when
// the light does not report it.
function brightness(dev) {
  const level = attr(dev, "LevelControl", "CurrentLevel");
  return typeof level === "number" ? Math.min(1, Math.max(0, level / 254)) : null;
}

// What a device draws, for its tag, when it measures its own load: " · 42.5 W". A reading, never a guess.
function draws(dev) {
  const milliwatts = attr(dev, "ElectricalPowerMeasurement", "ActivePower");
  if (typeof milliwatts !== "number") return "";
  const w = milliwatts / 1000;
  return ` · ${w >= 1000 ? `${(w / 1000).toFixed(2)} kW` : w >= 100 ? `${Math.round(w)} W` : `${w.toFixed(1)} W`}`;
}

// Which model a device gets. Two plugs are told apart by what they power, from the device name.
function modelFor(device) {
  switch (device.device_type) {
    case "DoorLock": return "lock";
    case "WaterLeakSensor": return "leak";
    case "WaterValve": return "valve";
    case "LaundryDryer": case "LaundryWasher": return "dryer";
    case "RoboticVacuumCleaner": return "vacuum";
    case "StickVacuumCleaner": return "stick";
    case "AirPurifier": return "purifier";
    case "OnOffLight": return "lamp";
    case "OnOffPlug": return /heater/i.test(device.name) ? "heater" : /lamp|light/i.test(device.name) ? "lamp" : "plug";
    case "Doorbell": return "doorbell";
    case "CastingVideoPlayer": return "tv";
    default: return "generic";
  }
}

// ---- Devices in the scene

const state = { devices: new Map(), views: new Map(), selected: null, offline: false };
const pickables = [];
const labels = $("labels");
const SLOTS = [[0.2, 0.25], [0.8, 0.25], [0.2, 0.75], [0.8, 0.75], [0.5, 0.5], [0.5, 0.2], [0.5, 0.8], [0.2, 0.5], [0.8, 0.5]];
const slotsUsed = new Map();   // room id -> slots handed out
let outside = 0;

// Where a device stands: where the layout places it, else in the room that carries its room's
// name, else in a row in front of the house. The 2D twin uses the same rules, so both agree.
function spotFor(device) {
  const place = layout.placements[device.id];
  if (place && ROOMS.has(place.room)) return { ...inRoom(place.room, place.x, place.y), room: place.room };
  const room = ROOM_NAMES.get((device.room || "").trim().toLowerCase());
  if (room) {
    const n = slotsUsed.get(room) || 0;
    slotsUsed.set(room, n + 1);
    return { ...inRoom(room, ...SLOTS[n % SLOTS.length]), room };
  }
  return { x: -HOUSE.w / 2 + 0.5 + outside++ * 0.9, z: HOUSE.d / 2 + 1.1 };
}

function addView(device) {
  const model = modelFor(device);
  const view = BUILDERS[model](device.device_type, device, spotFor(device));
  view.model = model;
  view.id = device.id;
  for (const object of [view.group, ...(view.extra || [])]) {
    object.traverse((o) => { if (o.isMesh) { o.userData.deviceId = device.id; pickables.push(o); } });
  }
  const tag = el("button", "tag");
  tag.type = "button";
  tag.addEventListener("click", () => select(device.id));
  view.tag = tag;
  view.flash = null;   // {text, tone, until}
  labels.appendChild(tag);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.5, 48), new THREE.MeshBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.9 }));
  ring.rotation.x = -Math.PI / 2;
  ring.visible = false;
  scene.add(ring);
  view.ring = ring;
  state.views.set(device.id, view);
  return view;
}

function renderTag(view, device) {
  const [text, tone] = view.label(device);
  const name = el("b", "", device.name);
  const status = el("i", device.online ? tone : "muted", device.online ? text : "offline");
  const parts = [name, status];
  if (view.flash && view.flash.until > performance.now()) parts.push(el("span", `flash ${view.flash.tone}`, view.flash.text));
  view.tag.replaceChildren(...parts);
  view.tag.classList.toggle("selected", state.selected === device.id);
  view.tag.setAttribute("aria-label", `${device.name}: ${device.online ? text : "offline"}`);
}

function flash(deviceId, text, tone) {
  const view = state.views.get(deviceId);
  if (!view) return;
  view.flash = { text, tone, until: performance.now() + 4500 };
  pulseAt(view, tone);
  const device = state.devices.get(deviceId);
  if (device) renderTag(view, device);
  setTimeout(() => { const d = state.devices.get(deviceId); if (d) renderTag(view, d); }, 4600);
}

// An expanding ring on the floor under a device: cyan for a dry run, green for a confirmed command.
const pulses = [];
function pulseAt(view, tone) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.38, 48),
    new THREE.MeshBasicMaterial({ color: TONE[tone] ?? TONE.info, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2;
  const at = groundOf(view);
  ring.position.set(at.x, 0.03, at.z);
  scene.add(ring);
  pulses.push({ ring, born: performance.now() });
}
function groundOf(view) {
  const p = view.labelAt || view.group.position;
  return new THREE.Vector3(p.x, 0, p.z);
}

function syncDevices(list) {
  const seen = new Set();
  for (const device of list) {
    seen.add(device.id);
    state.devices.set(device.id, device);
    const view = state.views.get(device.id) || addView(device);
    renderTag(view, device);
  }
  for (const [id, view] of state.views) {
    if (seen.has(id)) continue;
    for (const object of [view.group, ...(view.extra || []), view.ring]) scene.remove(object);
    if (view.release) view.release();
    view.tag.remove();
    state.views.delete(id);
    state.devices.delete(id);
  }
  renderPanel();
}

// ---- Picking and the side panel

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  select(hit ? hit.object.userData.deviceId : null);
});

function select(id) {
  state.selected = id && state.devices.has(id) ? id : null;
  if (outcome && outcome.deviceId !== state.selected && !busy) outcome = null;
  for (const [vid, view] of state.views) {
    view.ring.visible = vid === state.selected;
    const device = state.devices.get(vid);
    if (device) renderTag(view, device);
  }
  if (state.selected) {
    const view = state.views.get(state.selected);
    const target = groundOf(view);
    const offset = camera.position.clone().sub(controls.target).setLength(12);
    if (view.front) {
      // A thing with a face (a TV's screen): come round to where it shows, on the side the
      // camera is already on, keeping its height.
      const flat = new THREE.Vector3(offset.x, 0, offset.z);
      const reach = flat.length();
      const side = new THREE.Vector3(-view.front.z, 0, view.front.x);
      if (flat.dot(view.front) < reach * 0.6) {
        flat.copy(view.front).addScaledVector(side, 0.6 * (Math.sign(flat.dot(side)) || 1)).setLength(reach);
        offset.x = flat.x;
        offset.z = flat.z;
      }
    }
    framed = null;
    cameraGoal = { position: target.clone().add(offset), target };
  }
  renderPanel();
  $("panel").scrollTop = 0;
}

const PATHS = { matter: "Matter (local)", lg_thinq: "LG ThinQ (cloud)", google_home: "Google Home (cloud)", ring: "Ring (cloud)" };
// What every plug draws now (GET /home/energy): the same panel as under the 2D plan. It is made
// once and put back on each render of the home view, so it keeps its readings.
const energyPanel = document.createElement("porch-energy");
// Everything the platform reports about the selected device (details.js), kept across re-renders.
const detailsPanel = document.createElement("porch-details");
energyPanel.setAttribute("layout", "list");
energyPanel.className = "energy";
let busy = false;
let outcome = null;   // {deviceId, text, tone, protection}: how the last command on a device went

function renderPanel() {
  const panel = $("panel");
  const device = state.selected && state.devices.get(state.selected);
  if (!device) {
    const items = [...state.devices.values()].map((d) => {
      const view = state.views.get(d.id);
      const button = el("button", "");
      button.type = "button";
      const [text] = view ? view.label(d) : ["", ""];
      button.append(el("span", "", d.name), el("small", "", d.online ? text : "offline"));
      button.addEventListener("click", () => select(d.id));
      return button;
    });
    const list = el("div", "list");
    list.append(...items);
    const kids = [el("h2", "", layout.name), el("div", "sub", `${state.devices.size} devices · click one in the scene or below`)];
    if (layout.problem) kids.push(el("div", "note", layout.source === "none" ? layout.problem : `${layout.problem} Showing the demo plan.`));
    panel.replaceChildren(...kids, list, energyPanel);
    return;
  }
  const back = el("button", "back", "← All devices");
  back.type = "button";
  back.addEventListener("click", () => select(null));
  const facts = el("dl");
  const add = (k, v) => facts.append(el("dt", "", k), el("dd", "", v));
  add("Room", device.room);
  add("Type", device.device_type);
  add("Path", PATHS[device.primary_control_path] || device.primary_control_path);
  if ((device.control_paths || []).length > 1) add("Fallback", device.control_paths.slice(1).join(", "));
  add("Online", device.online ? "yes" : "no");
  for (const [cluster, c] of Object.entries(device.clusters || {})) {
    facts.append(el("dt", "group", cluster));
    for (const [name, value] of Object.entries(c.attributes)) add(name, JSON.stringify(value));
  }
  const cmds = el("div", "cmds");
  const shown = outcome && outcome.deviceId === device.id ? outcome : null;
  const result = el("div", shown ? `result ${shown.tone}` : "result", shown ? shown.text : "");
  result.id = "result";
  result.setAttribute("role", "status");
  if (shown && shown.protection) {
    // Family protection refused it. The owner can open a control window from here, with the PIN.
    const open = el("button", "", "Open a control window for it");
    open.type = "button";
    open.addEventListener("click", () => {
      const nav = document.querySelector("porch-nav");
      if (nav && nav.openProtectionPanel) nav.openProtectionPanel([device.id]);
    });
    result.append(open);
  }
  const commands = [...new Set(Object.values(device.clusters || {}).flatMap((c) => c.commands))];
  for (const command of commands) {
    let params = () => ({});
    if (command === "SetDelayStart") {
      const hours = el("input");
      hours.type = "number"; hours.min = "0"; hours.max = "23"; hours.value = "4"; hours.id = "delay-hours";
      hours.setAttribute("aria-label", "Delay in hours");
      params = () => ({ hours: Number(hours.value) });
      cmds.append(hours);
    }
    const button = el("button", "", command);
    button.type = "button";
    button.disabled = busy || !device.online;
    button.addEventListener("click", () => run(device, command, params()));
    cmds.append(button);
  }
  const kids = [back, el("h2", "", device.name), el("div", "sub", device.id), facts];
  if (commands.length) kids.push(el("div", "sub", "Commands run on the digital copy first, then on the device, then the hub reads it back."), cmds, result);
  else kids.push(el("div", "sub", "The hub reads this device. It takes no commands."));
  if (detailsPanel.getAttribute("device-id") !== device.id) detailsPanel.setAttribute("device-id", device.id);
  kids.push(detailsPanel);
  panel.replaceChildren(...kids);
}

const blockedByProtection = (reason) => /^Family protection/.test(reason || "");

async function run(device, command, params) {
  if (busy) return;
  busy = true;
  const say = (text, tone, protection = false) => { outcome = { deviceId: device.id, text, tone, protection }; renderPanel(); };
  say(`Dry run of ${command}…`, "info");
  try {
    const path = `/devices/${devicePath(device.id)}`;
    const preview = await hub("POST", `${path}/simulate`, { command, params });
    if (!preview.would_succeed) {
      const reason = preview.reason || "the dry run says it would fail";
      const blocked = blockedByProtection(reason);
      say(`Not sent. ${reason}`, blocked ? "warn" : "bad", blocked);
      return;
    }
    say(`Sending ${command}…`, "info");
    const done = await hub("POST", `${path}/commands`, { command, params, idempotency_key: newKey() });
    say(done.status === "done" ? `Confirmed by read-back${SHOW_TIMES ? ` in ${done.latency_ms} ms` : ""} via ${done.control_path}${done.simulated ? " (digital copy)" : ""}`
                               : `Failed: ${done.error}`, done.status === "done" ? "ok" : "bad");
  } catch (error) {
    const blocked = error.status === 403 && blockedByProtection(error.message);
    say(blocked ? `Not sent. ${error.message}` : error.message, blocked ? "warn" : "bad", blocked);
  } finally {
    busy = false;
    renderPanel();
  }
}

// ---- Live data

function feed(text, tone = "info") {
  const line = el("div", tone);
  line.append(el("time", "", new Date().toLocaleTimeString([], { hour12: false })), document.createTextNode(text));
  const box = $("feed");
  box.append(line);
  while (box.children.length > 5) box.firstChild.remove();
}

const VERBS = { LockDoor: "locked", UnlockDoor: "unlocked", Start: "started", Stop: "stopped", Pause: "paused",
                GoHome: "sent home", On: "turned on", Off: "turned off", Toggle: "toggled", Open: "opened",
                Close: "closed", SetDelayStart: "delayed", Play: "playing" };

function onEvent(event) {
  const device = event.device_id ? state.devices.get(event.device_id) : null;
  switch (event.type) {
    case "state_changed":
      if (!device) return;
      device.clusters = event.clusters;
      break;
    case "online_changed":
      if (!device) return;
      device.online = event.online;
      feed(`${device.name} is ${event.online ? "back online" : "offline"}`, event.online ? "ok" : "warn");
      break;
    case "command_simulated":
      if (!device) return;
      if (!event.would_succeed && blockedByProtection(event.error)) {
        flash(device.id, `${event.command} held back`, "warn");
        feed(`Family protection held back ${event.command} on ${device.name}: no control window is open`, "warn");
        return;
      }
      flash(device.id, event.would_succeed ? `dry run: ${event.command} ok` : `dry run: ${event.command} would fail`,
            event.would_succeed ? "info" : "bad");
      feed(`Dry run on the digital copy: ${event.command} on ${device.name} ${event.would_succeed ? "would succeed" : `would fail (${event.error})`}`,
           event.would_succeed ? "info" : "bad");
      return;
    case "protection_changed": {
      const window = event.data || {};
      const names = (window.device_ids || []).map((id) => (state.devices.get(id) || {}).name || id).join(", ");
      feed(window.live_writes_enabled ? `Owner opened a control window for ${names}` : "Control window closed: family protection is on",
           window.live_writes_enabled ? "ok" : "warn");
      if (outcome && outcome.protection) { outcome = null; renderPanel(); }
      return;
    }
    case "command_executed":
      if (!device || event.replayed) return;
      if (event.clusters && Object.keys(event.clusters).length) device.clusters = { ...device.clusters, ...event.clusters };
      if (event.status === "done") {
        flash(device.id, SHOW_TIMES ? `confirmed · ${event.latency_ms} ms` : "confirmed", "ok");
        feed(`${device.name} ${VERBS[event.command] || event.command} · confirmed by read-back${SHOW_TIMES ? ` in ${event.latency_ms} ms` : ""}${event.simulated ? " (digital copy)" : ""}`, "ok");
      } else {
        flash(device.id, `${event.command} failed`, "bad");
        feed(`${event.command} on ${device.name} failed: ${event.error}`, "bad");
      }
      break;
    case "mode_changed":
      state.offline = Boolean(event.data && event.data.offline);
      renderMode();
      feed(`Offline demo mode ${state.offline ? "on: commands run on the digital copy" : "off"}`, "warn");
      loadDevices();
      return;
    case "resync_required":
      loadDevices();
      return;
    default:
      return;
  }
  const view = state.views.get(device.id);
  if (view) renderTag(view, device);
  if ((state.selected === device.id && !busy) || !state.selected) renderPanel();
}

function renderMode() {
  const pill = $("mode-pill");
  pill.className = `pill ${state.offline ? "offline" : "live"}`;
  pill.textContent = state.offline ? "DIGITAL COPY · OFFLINE" : "LIVE HARDWARE";
}

async function loadDevices() {
  try {
    syncDevices(await hub("GET", "/devices"));
    state.offline = (await hub("GET", "/demo/offline-mode")).enabled;
    renderMode();
  } catch (error) {
    feed(`Could not load devices: ${error.message}`, "bad");
  }
}

function connect() {
  let retry = 1000;
  const open = () => {
    const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/events`);
    socket.addEventListener("open", () => {
      retry = 1000;
      $("ws-label").textContent = "Live";
      $("ws-dot").className = "dot on";
      loadDevices();
    });
    socket.addEventListener("message", (m) => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.warn(e); } });
    socket.addEventListener("close", () => {
      $("ws-label").textContent = "Reconnecting…";
      $("ws-dot").className = "dot";
      setTimeout(open, retry);
      retry = Math.min(retry * 2, 10000);
    });
  };
  open();
}

// ---- Frame loop

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = `${w}px`;
  renderer.domElement.style.height = `${h}px`;
  // Centre the house in the space the panel leaves: left of it on wide screens, above it on phones.
  const wide = w > 720;
  const side = wide ? $("panel").offsetWidth + 24 : 0;
  const below = wide ? 0 : $("panel").offsetHeight + 24;
  camera.aspect = (w + side) / (h + below);
  camera.setViewOffset(w + side, h + below, side, below, w, h);
  camera.updateProjectionMatrix();
  fitViews(w - side, h - below - 60, h + below);
  if (framed) setView(framed);   // keep a preset view fitted as the window or panel changes size
}
addEventListener("resize", resize);
new ResizeObserver(resize).observe($("panel"));

const projected = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (cameraGoal) {
    const k = 1 - Math.pow(0.002, dt);
    camera.position.lerp(cameraGoal.position, k);
    controls.target.lerp(cameraGoal.target, k);
    if (camera.position.distanceTo(cameraGoal.position) < 0.02) cameraGoal = null;
  }
  controls.update();
  for (const [id, view] of state.views) {
    const device = state.devices.get(id);
    if (!device) continue;
    view.update(device, now, dt);
    const ground = groundOf(view);
    view.ring.position.set(ground.x, 0.02, ground.z);
    projected.copy(view.labelAt || view.group.position).project(camera);
    const visible = projected.z < 1 && Math.abs(projected.x) < 1.2 && Math.abs(projected.y) < 1.2;
    view.tag.hidden = !visible;
    if (visible) {
      view.tag.style.left = `${((projected.x + 1) / 2) * container.clientWidth}px`;
      view.tag.style.top = `${((1 - projected.y) / 2) * container.clientHeight}px`;
    }
  }
  for (const ghost of ghosts) {
    projected.copy(ghost.at).project(camera);
    const visible = projected.z < 1 && Math.abs(projected.x) < 1.2 && Math.abs(projected.y) < 1.2;
    ghost.tag.hidden = !visible;
    if (visible) {
      ghost.tag.style.left = `${((projected.x + 1) / 2) * container.clientWidth}px`;
      ghost.tag.style.top = `${((1 - projected.y) / 2) * container.clientHeight}px`;
    }
  }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    const k = (now - p.born) / 1400;
    if (k >= 1) { scene.remove(p.ring); p.ring.geometry.dispose(); p.ring.material.dispose(); pulses.splice(i, 1); continue; }
    p.ring.scale.setScalar(1 + k * 3);
    p.ring.material.opacity = 1 - k;
  }
  agentsFrame(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// A meter clicked in the energy panel opens that device here.
document.addEventListener("porch:select-device", (event) => select(event.detail.id));

// ---- The household's agents and Porch (agents.js): the agents in a row above the house, Porch
// between them and the home, and every request drawn from the agent to Porch to the device.

const AGENT_Y = 4, PORCH_AT = new THREE.Vector3(0, 2.7, 0);
const HEADROOM = new THREE.Vector3(0, 2.6, 0);  // room above the agents for their tags, which sit over them
const BEAM = { live: 0x38bdf8, ok: 0x34d399, held: 0xfbbf24, blocked: 0xfb7185 };
const porchNode = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 1), new THREE.MeshBasicMaterial({ color: 0xa78bfa }));
const porchHalo = new THREE.Mesh(new THREE.RingGeometry(0.44, 0.52, 48),
  new THREE.MeshBasicMaterial({ color: 0xa78bfa, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
porchNode.position.copy(PORCH_AT);
porchHalo.position.copy(PORCH_AT);
porchNode.visible = porchHalo.visible = false;
scene.add(porchNode, porchHalo);
const porchTag = el("div", "tag porch", "PORCH");
porchTag.hidden = true;
labels.appendChild(porchTag);
const agentsLayer = { list: [], anchors: new Map(), tags: new Map(), orbs: new Map(), current: null, beams: [], timer: null, count: 0 };

function agentAnchor(i, n) {
  const half = Math.max(2, HOUSE.w / 2);  // the house's full width: the tags need the room
  return new THREE.Vector3(n === 1 ? 0 : -half + (2 * half * i) / (n - 1), AGENT_Y, -HOUSE.d / 2 - 1);
}
function renderAgents3d(list) {
  agentsLayer.list = list;
  for (const [id, tag] of agentsLayer.tags) {
    if (list.some((a) => a.id === id)) continue;
    tag.remove();
    scene.remove(agentsLayer.orbs.get(id));
    agentsLayer.tags.delete(id);
    agentsLayer.orbs.delete(id);
  }
  list.forEach((agent, i) => {
    const app = PorchAgents.APPS[agent.client] || { short: agent.client, tone: "" };
    let tag = agentsLayer.tags.get(agent.id);
    if (!tag) {
      tag = el("div", "tag agent");
      labels.appendChild(tag);
      agentsLayer.tags.set(agent.id, tag);
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 14),
        new THREE.MeshBasicMaterial({ color: app.tone === "chatgpt" ? 0x5fd4b4 : app.tone === "claude" ? 0xe8a27c : 0x94a3b8 }));
      scene.add(orb);
      agentsLayer.orbs.set(agent.id, orb);
    }
    // Name and app only: on a wide house the agents stand close together. The 2D twin says when
    // each last called; here one that never has is dimmed, and the one asking now is outlined.
    const who = el("span");
    who.append(el("b", "", agent.name), el("small", "", app.short));
    tag.replaceChildren(el("span", `face ${app.tone}`, agent.name.slice(0, 1).toUpperCase()), who);
    tag.classList.toggle("active", agentsLayer.current === agent.id);
    tag.classList.toggle("never", !agent.last_seen);
    tag.classList.toggle("lift", list.length > 4 && i % 2 === 1);
    const at = agentAnchor(i, list.length);
    agentsLayer.anchors.set(agent.id, at);
    agentsLayer.orbs.get(agent.id).position.copy(at);
  });
  porchNode.visible = porchHalo.visible = list.length > 0;
  fitExtra.length = 0;
  if (list.length) {
    fitExtra.push(agentAnchor(0, list.length).add(HEADROOM), agentAnchor(list.length - 1, list.length).add(HEADROOM), PORCH_AT.clone());
  }
  if (list.length !== agentsLayer.count) {   // the row changed: frame the house and the agents again
    agentsLayer.count = list.length;
    resize();
  }
}
function clearBeams() {
  for (const b of agentsLayer.beams) {
    scene.remove(b.line, b.dot);
    b.line.geometry.dispose(); b.line.material.dispose(); b.dot.geometry.dispose(); b.dot.material.dispose();
  }
  agentsLayer.beams = [];
}
function beam(from, to, tone) {
  if (!from || !to) return;
  const mid = from.clone().add(to).multiplyScalar(0.5);
  mid.y += 0.6 + from.distanceTo(to) * 0.08;
  const curve = new THREE.QuadraticBezierCurve3(from.clone(), mid, to.clone());
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),
    new THREE.LineDashedMaterial({ color: BEAM[tone], dashSize: 0.22, gapSize: 0.14, transparent: true, opacity: 0.95 }));
  line.computeLineDistances();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8), new THREE.MeshBasicMaterial({ color: BEAM[tone] }));
  scene.add(line, dot);
  agentsLayer.beams.push({ line, dot, curve, phase: Math.random() });
}
function deviceAt(id) {
  const view = state.views.get(id);
  return view ? (view.labelAt || view.group.position).clone() : null;
}
function markDevice(id, text, tone, ms) {
  const view = state.views.get(id), device = state.devices.get(id);
  if (!view || !device) return;
  view.flash = { text, tone, until: performance.now() + ms };
  renderTag(view, device);
  pulseAt(view, tone === "ok" ? "ok" : tone === "bad" ? "bad" : tone === "warn" ? "warn" : "info");
}
function caption(step, tone) {
  const box = $("porch-caption");
  box.hidden = !step;
  if (!step) return;
  box.className = tone || "";
  box.querySelector("b").textContent = step.text;
  box.querySelector("span").textContent = step.sub || "";
}
function onAgentStep3d(step) {
  const f = step.flow, agent = f.agent && f.agent.id, device = f.device && f.device.id;
  const from = agentsLayer.anchors.get(agent);
  clearTimeout(agentsLayer.timer);
  clearBeams();
  agentsLayer.current = agent;
  let tone = "live";
  switch (step.kind) {
    case "ask":
      beam(from, PORCH_AT, "live");
      break;
    case "decide":
      tone = step.decision === "allow" ? "ok" : step.decision === "deny" ? "blocked" : "held";
      beam(from, PORCH_AT, tone);
      if (tone !== "ok" && device) {
        beam(PORCH_AT, deviceAt(device), tone);
        markDevice(device, tone === "blocked" ? "refused by Porch" : `waiting for ${step.flow.waiting_for || "approval"}`, tone === "blocked" ? "bad" : "warn", 3000);
      }
      break;
    case "stopped":
      tone = "blocked";
      beam(from, PORCH_AT, "ok");
      if (device) { beam(PORCH_AT, deviceAt(device), "blocked"); markDevice(device, "family protection", "bad", 3000); }
      break;
    case "send":
      tone = step.ok ? "live" : "blocked";
      beam(from, PORCH_AT, "ok");
      if (device) { beam(PORCH_AT, deviceAt(device), tone); markDevice(device, "sending…", "info", 1600); }
      break;
    case "done":
      tone = step.verified ? "ok" : "blocked";
      beam(from, PORCH_AT, "ok");
      if (device) { beam(PORCH_AT, deviceAt(device), tone); markDevice(device, step.verified ? (SHOW_TIMES ? `verified · ${step.latency} ms` : "verified") : "not confirmed", step.verified ? "ok" : "bad", 3000); }
      break;
    case "read":
      tone = "ok";
      beam(from, PORCH_AT, "ok");
      for (const id of step.devices.slice(0, 14)) { beam(PORCH_AT, deviceAt(id), "live"); markDevice(id, "read", "info", 1800); }
      break;
    case "answered": tone = step.approved ? "ok" : "blocked"; break;
    case "error": tone = "blocked"; break;
    default: tone = "live";
  }
  caption(step, tone);
  renderAgents3d(agentsLayer.list);
  agentsLayer.timer = setTimeout(() => {
    clearBeams();
    agentsLayer.current = null;
    caption(null);
    renderAgents3d(agentsLayer.list);
  }, 9000);
}
function placeTag(tag, at, show) {
  if (!tag || !at) return;
  projected.copy(at).project(camera);
  const visible = show && projected.z < 1 && Math.abs(projected.x) < 1.2 && Math.abs(projected.y) < 1.2;
  tag.hidden = !visible;
  if (visible) {
    tag.style.left = `${((projected.x + 1) / 2) * container.clientWidth}px`;
    tag.style.top = `${((1 - projected.y) / 2) * container.clientHeight}px`;
  }
}
const PORCH_LABEL_AT = PORCH_AT.clone().add(new THREE.Vector3(0, 0.62, 0));
function agentsFrame(now) {
  const shown = agentsLayer.list.length > 0;
  placeTag(porchTag, PORCH_LABEL_AT, shown);
  for (const agent of agentsLayer.list) placeTag(agentsLayer.tags.get(agent.id), agentsLayer.anchors.get(agent.id), true);
  porchNode.rotation.y += 0.012;
  porchHalo.lookAt(camera.position);
  for (const b of agentsLayer.beams) b.dot.position.copy(b.curve.getPoint((now / 1400 + b.phase) % 1));
}
if (window.PorchAgents) PorchAgents.follow({ onAgents: renderAgents3d, onStep: onAgentStep3d });

renderPanel();
resize();
camera.position.set(...VIEWS.overview.position);
requestAnimationFrame(frame);
connect();
</script>
</body>
