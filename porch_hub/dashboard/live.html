<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porch Live</title>
<script src="/nav.js" defer></script>
<script src="/agents.js" defer></script>
<style>
/* The Live flow and the 3D home side by side, for recording or presenting: what Porch decides about
   each request, and where it goes in the home. Both are the hub's own pages, each following the
   gateway's stage feed; the menu is shown once, here. No CDN, no web font.

   ?record is the recording mode: no menu, title or view links, only a slim PORCH bar with the family
   protection and "waiting for a yes" labels; the two views without their own headers and captions;
   and one large caption across the bottom that says each step as it happens. T shows a title card,
   E an end card, F full screen. */
:root{--bg:#060a14;--line:#243049;--text:#e6ebf5;--muted:#8a97b0;
  --ask:#38bdf8;--ok:#34d399;--bad:#fb7185;--held:#fbbf24;--read:#a78bfa;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
[hidden]{display:none!important}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.1rem;padding:.45rem 1rem;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.05rem}
.top p{margin:0;color:var(--muted);font-size:.8rem}
.top .views{margin-left:auto;display:flex;gap:.4rem}
.top .views a{padding:.2rem .6rem;border:1px solid var(--line);border-radius:.45rem;color:var(--muted);font-size:.78rem;text-decoration:none}
.top .views a[aria-current]{color:var(--text);border-color:#5eead4}
.brand{display:none;font-weight:800;letter-spacing:.34em;color:#c4b5fd;font-size:1.05rem}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
.split iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.split iframe + iframe{border-left:1px solid var(--line)}
@media (max-width:1000px){
  body{height:auto;overflow:auto}
  .split{grid-template-columns:minmax(0,1fr)}
  .split iframe{height:85vh}
  .split iframe + iframe{border-left:0;border-top:1px solid var(--line)}
}

/* Recording mode */
body.record .top{padding:.55rem 1.2rem}
body.record .top > div, body.record .top .views{display:none}
body.record .brand{display:block;order:-1}
.caption-strip{display:none}
body.record .caption-strip{display:flex;align-items:center;gap:1.4rem;min-height:7.2rem;padding:1rem 2rem;
  border-top:3px solid var(--tone,var(--line));background:linear-gradient(180deg,#0b1222,#060a14)}
.caption-strip .who{display:flex;align-items:center;gap:.7rem;min-width:13rem;transition:opacity .35s}
.caption-strip .face{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:#64748b;
  color:#0b1220;font-weight:800;font-size:1.35rem}
.caption-strip .face.claude{background:#e8a27c}.caption-strip .face.chatgpt{background:#5fd4b4}
.caption-strip .name{font-weight:750;font-size:1.25rem}
.caption-strip .app{color:var(--muted);font-size:.95rem}
.caption-strip .words{flex:1;min-width:0;transition:opacity .35s}
.caption-strip .say{margin:0;font-size:2.15rem;font-weight:780;line-height:1.2;color:var(--tone,var(--text))}
.caption-strip .sub{margin:.35rem 0 0;font-size:1.25rem;color:var(--muted);line-height:1.35}
.caption-strip.idle .say{color:var(--muted);font-weight:600;font-size:1.5rem}
.caption-strip.fading .words,.caption-strip.fading .who{opacity:0}

/* Title and end cards (T, E) */
.card-overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:2rem;
  background:radial-gradient(circle at 50% 42%,#1a1640 0%,#060a14 62%)}
.card-overlay .mark{font-size:clamp(4rem,11vw,9rem);font-weight:850;letter-spacing:.3em;margin-right:-.3em;color:#c4b5fd}
.card-overlay .line{margin-top:1.2rem;font-size:clamp(1.3rem,2.6vw,2.3rem);color:var(--text);font-weight:600}
.card-overlay .small{margin-top:1.6rem;font-size:clamp(.9rem,1.4vw,1.2rem);color:var(--muted);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.caption-strip *{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">PORCH</span>
  <porch-nav></porch-nav>
  <div>
    <h1>Live: Porch and the home</h1>
    <p>Each request an agent sends, as Porch checks it (right), and where it goes in the home (left).</p>
  </div>
  <nav class="views" aria-label="The home's view">
    <a id="view-3d" href="?view=3d">3D home</a>
    <a id="view-2d" href="?view=2d">Floor plan</a>
  </nav>
</header>
<main class="split">
  <iframe id="home" title="The home"></iframe>
  <iframe id="flow" title="Live flow"></iframe>
</main>
<section class="caption-strip idle" id="strip" aria-live="polite" aria-label="What is happening">
  <div class="who" id="who" hidden><span class="face" id="face"></span><span><div class="name" id="who-name"></div><div class="app" id="who-app"></div></span></div>
  <div class="words"><p class="say" id="say">Waiting for an agent…</p><p class="sub" id="sub"></p></div>
</section>
<div class="card-overlay" id="title-card" hidden>
  <div><div class="mark">PORCH</div><div class="line" id="title-line"></div><div class="small" id="title-small"></div></div>
</div>
<div class="card-overlay" id="end-card" hidden>
  <div><div class="line" id="end-line"></div><div class="mark" style="margin-top:1.4rem">PORCH</div><div class="small" id="end-small"></div></div>
</div>
<script>
"use strict";
// Both views get this page's own options: engine= (the gateway's stage feed), pace= (how long each
// step stays on screen) and record. view=2d shows the floor plan in place of the 3D home.
const params = new URLSearchParams(location.search);
const flat = params.get("view") === "2d";
const record = params.has("record");
if (record && !params.has("pace")) params.set("pace", "1.5");  // a viewer reads each step
const pass = new URLSearchParams([...params].filter(([key]) => ["engine", "pace", "record"].includes(key))).toString();
const withPass = (path) => (pass ? `${path}?${pass}` : path);
const $ = (id) => document.getElementById(id);
// While recording, the home plays each request's few steps more slowly, so its beams land while
// the flow beside it tells the same steps one by one, not before.
const homePass = new URLSearchParams(pass);
if (record) homePass.set("pace", String(Number(params.get("pace")) * 1.8));
$("home").src = `${flat ? "/digital-twin" : "/home-3d"}?${homePass}`;
$("home").title = flat ? "The home's floor plan" : "The 3D home";
$("flow").src = withPass("/flow");
$(flat ? "view-2d" : "view-3d").setAttribute("aria-current", "page");
for (const link of document.querySelectorAll(".views a")) {
  const keep = new URLSearchParams(pass);
  keep.set("view", link.id === "view-2d" ? "2d" : "3d");
  link.href = `?${keep}`;
}

// ---- Recording mode: one large caption, title and end cards, full screen

if (record) {
  document.body.classList.add("record");
  document.title = "PORCH";
  // The cards' words, unless the address gives others (all set as text).
  $("title-line").textContent = params.get("title") || "The safety gateway between AI agents and your home";
  $("title-small").textContent = params.get("subtitle") || "";
  $("end-line").textContent = params.get("end") || "Agents ask. Porch checks. You decide.";
  $("end-small").textContent = params.get("endsub") || "";
}

// The caption says what the Live flow beside it says, sentence by sentence (it sends each one up),
// so the words always match the step lighting up. Tones: the flow's own (held, blocked, done).
const TONE = { "": "--ask", done: "--ok", blocked: "--bad", held: "--held" };
let fadeTimer = null;
function showCaption(message) {
  const strip = $("strip");
  const idle = message.tone === "idle";
  clearTimeout(fadeTimer);
  strip.classList.add("fading");
  fadeTimer = setTimeout(() => {
    const agent = message.agent || {};
    const app = window.PorchAgents && PorchAgents.APPS[agent.client];
    $("who").hidden = idle || !agent.name;
    $("face").textContent = (agent.name || "?").slice(0, 1).toUpperCase();
    $("face").className = `face ${app ? app.tone : ""}`;
    $("who-name").textContent = agent.name || "";
    $("who-app").textContent = app ? app.short : agent.client || "";
    $("say").textContent = idle ? "Waiting for an agent…" : message.say;
    $("sub").textContent = idle ? "" : message.sub;
    if (idle) strip.style.removeProperty("--tone");
    else strip.style.setProperty("--tone", `var(${TONE[message.tone] || "--ask"})`);
    strip.classList.toggle("idle", idle);
    strip.classList.remove("fading");
  }, 160);
}

function toggleCard(id) {
  const card = $(id);
  const open = card.hidden;
  for (const other of ["title-card", "end-card"]) $(other).hidden = true;
  card.hidden = !open;
}
function onKey(event) {
  if (!record || event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === "t") toggleCard("title-card");
  else if (key === "e") toggleCard("end-card");
  else if (key === "escape") { $("title-card").hidden = $("end-card").hidden = true; }
  else if (key === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } else return;
  event.preventDefault();
}
addEventListener("keydown", onKey);
// The keys work wherever the pointer last clicked, the two views included (same origin).
for (const frame of [$("home"), $("flow")]) {
  frame.addEventListener("load", () => {
    try { frame.contentWindow.addEventListener("keydown", onKey); } catch { /* not ours */ }
  });
}

if (record) {
  addEventListener("message", (event) => {
    if (event.origin !== location.origin || event.source !== $("flow").contentWindow) return;
    const data = event.data;
    if (data && data.type === "porch-caption" && typeof data.say === "string") showCaption(data);
  });
}
</script>
</body>
</html>
